name: Build Wizard Ben 0.7

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Find build.gradle
        id: project
        run: |
          FILE=$(find . -name build.gradle -print -quit)
          if [ -z "$FILE" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Wizard-Ben-v0.7
          path: '**/build/libs/*.jar'
          if-no-files-found: error
